services:
  - type: web
    name: policymesh
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: AGENT_MODEL
        value: openai/gpt-oss-120b
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-2.5-flash
